[project]
name = "pii-sentinel"
version = "0.1.0"
description = "Multilingual PII detector: span labelling and document sensitivity, fine-tuned from mmBERT-base"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
  "torch>=2.9",
  "transformers>=5.17",
  "safetensors>=0.8",
  "regex>=2026.9",
]

[project.scripts]
pii-sentinel = "pii_sentinel.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13", "mypy>=1.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_sentinel"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"] # ruff format owns line length; long strings stay as written

[tool.pytest.ini_options]
testpaths = ["tests"]
