[project]
name = "pii-sentinel"
version = "0.3.0"
description = "Multilingual PII detector: span labelling and document sensitivity, fine-tuned from mmBERT-base"
keywords = ["pii", "personal-information", "privacy", "ner", "mmbert"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: Chinese (Simplified)",
  "Natural Language :: English",
  "Natural Language :: French",
  "Natural Language :: German",
  "Natural Language :: Italian",
  "Natural Language :: Japanese",
  "Natural Language :: Korean",
  "Natural Language :: Spanish",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Text Processing :: Linguistic",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
  "torch==2.14.1",
  "transformers==5.19.0",
  "safetensors==0.8.0",
  "regex==2026.9.29",
]

[project.urls]
Homepage = "https://github.com/coo-quack/pii-sentinel"
Model = "https://huggingface.co/coo-quack/mmBERT-pii-sentinel"
Changelog = "https://github.com/coo-quack/pii-sentinel/blob/main/CHANGELOG.md"
Issues = "https://github.com/coo-quack/pii-sentinel/issues"

[project.scripts]
pii-sentinel = "pii_sentinel.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10", "mypy==2.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_sentinel"]

# What the source distribution carries: the package, its tests and the notices. The evaluation sets, templates and
# training data stay in the repository.
[tool.hatch.build.targets.sdist]
include = ["src/pii_sentinel", "tests", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"] # ruff format owns line length; long strings stay as written

[tool.pytest.ini_options]
testpaths = ["tests"]
