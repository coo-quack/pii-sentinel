name: Audit

# The dependency audit has its own workflow so that the weekly schedule runs
# only this job, not all of CI. An advisory published while no PR is open is
# then caught within a week. The job name `audit` is a required check: keep it.
on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '31 19 * * 0' # Sunday 19:31 UTC = Monday 04:31 JST

concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements.txt
      - run: uvx pip-audit@2.10.1 -r requirements.txt --no-deps --disable-pip
